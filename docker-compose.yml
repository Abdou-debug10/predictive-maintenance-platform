services:

  # -----------------------------
  # Zookeeper
  # -----------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

  # -----------------------------
  # Kafka
  # -----------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test: [ "CMD", "bash", "-c", "cub kafka-ready -b localhost:9092 1 30" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------
  # PostgreSQL
  # -----------------------------
  postgres:
    image: postgres:16
    container_name: predictive_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: predictive_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  # -----------------------------
  # FastAPI Backend
  # -----------------------------
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile

    container_name: predictive_backend

    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - .:/app

  # -----------------------------
  # Kafka Consumer
  # -----------------------------
  consumer:
    build:
      context: .
      dockerfile: api/Dockerfile

    container_name: predictive_consumer

    command: python -u -m event_stream.consumer

    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy

    volumes:
      - .:/app

  # -----------------------------
  # React Frontend
  # -----------------------------
  frontend:
    build: ./frontend

    container_name: predictive_frontend

    depends_on:
      - backend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
